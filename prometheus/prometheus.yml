global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node"
    static_configs:
      - targets: ["<NODE_01_PRIVATE_IP>:9100"]
        labels:
          node: "node-01"
          environment: "lab"
      - targets: ["<NODE_02_PRIVATE_IP>:9100"]
        labels:
          node: "node-02"
          environment: "lab"